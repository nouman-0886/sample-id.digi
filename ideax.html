<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Sample Pakistani CNIC (Mockup)</title>
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="id-card">
		<div class="watermark">SAMPLE</div>
		<div class="header">
			<h1>PAKISTAN</h1>
			<p class="sub">IDENTITY CARD — SAMPLE</p>
		</div>
		<div class="card-body">
			<div class="photo" aria-hidden="true">Photo</div>
			<div class="details">
				<div class="row"><span class="label">Name</span><span class="value">Muhammad Ali</span></div>
				<div class="row"><span class="label">Father's Name</span><span class="value">Ahmed Khan</span></div>
				<div class="row"><span class="label">Date of Birth</span><span class="value">01 Jan 1990</span></div>
				<div class="row"><span class="label">ID Number</span><span class="value">SAMPLE-0000-000</span></div>
				<div class="note">This is a MOCKUP for design/educational use only. Not a legal document.</div>
			</div>
		</div>
	</div>
</body>
</html>
